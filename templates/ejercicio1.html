<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - Notas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename= 'style.css')}}">
</head>
<body>
   <!-- Contenedor principal del formulario-->
   <div class="contenedor formulario">

       <h1>Formulario de Notas</h1>

       <!-- Formulario para ingresar notas y asitencia -->
       <form action="/ejercicio1" method="post">

           <!-- Ingreso de la primera nota -->
           <label for="nota1">Nota 1:</label>
           <input type="number" id="nota1" name="nota1"
                   min="10" max="70" required>

           <!-- Ingreso de la segunda nota -->
           <label for="nota2">Nota 2:</label>
           <input type="number" id="nota2" name="nota2"
                   min="10" max="70" required>

           <!-- Ingreso de la tercera nota -->
           <label for="nota3">Nota 3:</label>
           <input type="number" id="nota3" name="nota3"
                   min="10" max="70" required>

           <!-- Ingreso del porcentaje de asistencia-->
           <label for="asistencia">Asistencia:</label>
           <input type="number" id="asistencia" name="asistencia"
                   min="0" max="100" required>

           <!-- Boton para enviar los datos-->
           <button type="submit" class="boton">Enviar</button>
       </form>

       <!-- Mostramos el resultado del calculo-->
       {% if promedio is defined %}
         <p>Promedio: {{ promedio }}</p>
         <p>Estado: {{ estado }}</p>
       {% endif %}
   </div>
</body>
</html>
